# Render Blueprint — CyberAI (backend + frontend), bepul (free) tarif.
# Render: Dashboard → New → Blueprint → shu repozitoriyni tanlang.
# `sync: false` qiymatlari birinchi deployda Render'da qo'lda kiritiladi (git'ga tushmaydi).
services:
  # ── Backend (Go + Gin) ───────────────────────────────────────────
  - type: web
    name: cyberai-backend
    runtime: go
    plan: free
    region: frankfurt # Neon bazasi ham Frankfurt'da — kechikish minimal
    rootDir: backend
    buildCommand: go build -tags netgo -ldflags "-s -w" -o server .
    startCommand: ./server
    healthCheckPath: /health
    envVars:
      - key: GIN_MODE
        value: release
      - key: JWT_SECRET
        generateValue: true
      # Neon: pool'li manzil (ilova) va to'g'ridan-to'g'ri manzil (migratsiya)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Frontend manzili (CORS). Render ichki nomni beradi ("cyber-learn-ab12"),
      # backend unga ".onrender.com" va https:// ni o'zi qo'shadi. Custom domen bo'lsa — qo'lda to'liq manzil yozing.
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: cyber-learn
          property: host
      - key: TEACHER_USERNAME
        value: teacher
      # O'qituvchi paroli (kamida 8 belgi). Render → Environment'da o'zgartirsangiz, servis qayta
      # ishga tushadi va bazadagi parol yangilanadi. Bo'sh qolsa — bazadagi parolga tegilmaydi.
      - key: TEACHER_PASSWORD
        sync: false
      - key: CERT_SIGNER_NAME
        sync: false
      - key: CERT_SIGNER_TITLE
        value: Ta'lim direktori
      - key: SEED_DEMO_DATA
        value: "false"
      # AI yordamchi kaliti (Google AI Studio) — faqat backend'da, brauzerga chiqmaydi. Ixtiyoriy.
      - key: GOOGLE_AI_API_KEY
        sync: false
      # PUBLIC_API_URL kerak emas — Render RENDER_EXTERNAL_URL'ni o'zi beradi (sertifikat QR kodi)

  # ── Frontend (React + Vite, statik sayt) ─────────────────────────
  - type: web
    name: cyber-learn
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Backend manzili. Render ichki nomni beradi ("cyberai-backend-l86z"), frontend unga
      # ".onrender.com" va https:// ni o'zi qo'shadi (src/lib/api.ts). Build paytida qo'shiladi.
      - key: VITE_API_URL
        fromService:
          type: web
          name: cyberai-backend
          property: host
    routes:
      # SPA: /learning/... kabi manzillar to'g'ridan-to'g'ri ochilganda ham index.html qaytsin
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite fayl nomlarida hash bor — uzoq keshlash xavfsiz
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Xavfsizlik: saytni begona sahifa <iframe>'iga joylab bo'lmaydi (clickjacking),
      # brauzer fayl turini taxmin qilmaydi, havola orqali manzil sizib chiqmaydi.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      # CSP: faqat o'z skriptlarimiz ishlaydi — XSS bo'lsa ham begona skript yuklanmaydi va
      # ma'lumot faqat backend'ga (*.onrender.com) yuboriladi. Custom domen ulasangiz,
      # backend manzilini connect-src'ga qo'shing. Stil 'unsafe-inline' — antd shuni talab qiladi.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.onrender.com; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
